<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiments</title>
  <meta name="description" content="A collection of small web experiments.">
  <style>
    :root {
      --bg: #07080f;
      --fg: #e6e7ee;
      --muted: #8a8ca0;
      --line: #23263a;
      --accent: #f2b08a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    body {
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12vh 16px 48px;
    }
    main { width: 100%; max-width: 560px; }
    h1 {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 24px;
    }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); }
    a {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 0;
      color: inherit;
      text-decoration: none;
    }
    .name { font-size: 22px; font-weight: 500; transition: color 0.2s; }
    .desc { color: var(--muted); font-size: 14px; display: block; margin-top: 2px; }
    .arrow { color: var(--muted); transition: transform 0.2s, color 0.2s; }
    a:hover .name, a:focus-visible .name { color: var(--accent); }
    a:hover .arrow, a:focus-visible .arrow { color: var(--accent); transform: translateX(4px); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Experiments</h1>
    <ul>
      <li>
        <a href="infinite-futures/">
          <span>
            <span class="name">Infinite Futures</span>
            <!-- <span class="desc">An endless ocean of liquid metal under a setting sun.</span> -->
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
