<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Infinite Futures (Realistic)</title>
  <meta name="description" content="An endless ocean of liquid metal under a realistic sky that sets into night and rises again.">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #07080f;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }
    #fallback {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: #c9cbd6;
      font: 15px/1.5 system-ui, sans-serif;
      text-align: center;
      padding: 16px;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="fallback">Your browser doesn't support WebGL2, which this page needs.</div>
  <script src="main.js"></script>
</body>
</html>
